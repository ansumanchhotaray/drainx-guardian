<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>DrainX Guardian Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=20261023_5">
</head>

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo">
                <h1>DrainX <span>Guardian</span></h1>
                <div class="status-indicator">
                    <div class="dot pulse"></div>
                    <span>System Online</span>
                </div>
            </div>
            <p class="subtitle">Real-time Autonomous Drainage Monitoring</p>
        </header>

        <main class="dashboard">
            <!-- Video Feed Section -->
            <section class="video-section glass-panel">
                <div class="panel-header">
                    <h2>Live Camera Feed</h2>
                    <span class="badge">AI Vision Active</span>
                </div>
                <div class="video-container">
                    <!-- Replace the src with your ESP32-CAM IP when running -->
                    <img id="camera-stream"
                        src="https://via.placeholder.com/640x480.png?text=Waiting+for+Camera+Stream..."
                        alt="Live Stream">
                    <div class="overlay-ui">
                        <div class="target-box"></div>
                    </div>
                </div>
                <div class="node-status-bar" id="cam-status-bar">
                    <div class="node-status-info">
                        <span class="status-dot searching" id="cam-dot"></span>
                        <span class="node-label">Camera:</span>
                        <span class="node-detail" id="cam-detail">Scanning...</span>
                    </div>
                    <span class="mac-badge" id="cam-mac-badge">MAC: Auto</span>
                </div>
                <button type="button" class="manual-toggle-btn" id="toggle-cam-manual">Manual IP Override ▾</button>
                <div class="controls manual-controls-container hidden" id="cam-manual-controls">
                    <input type="text" id="cam-ip" placeholder="ESP32-CAM IP (e.g. 192.168.137.x)" class="glass-input">
                    <button id="connect-cam" class="btn-primary">Connect Stream</button>
                </div>
            </section>

            <!-- Sensors & Motor Section -->
            <section class="sensors-section">
                <div class="node-status-bar" id="sensor-status-bar" style="margin-bottom: 0.5rem;">
                    <div class="node-status-info">
                        <span class="status-dot searching" id="sensor-dot"></span>
                        <span class="node-label">Sensors:</span>
                        <span class="node-detail" id="sensor-detail">Scanning...</span>
                    </div>
                    <span class="mac-badge" id="sensor-mac-badge">MAC: Auto</span>
                </div>
                <button type="button" class="manual-toggle-btn" id="toggle-sensor-manual">Manual IP Override ▾</button>
                <div class="controls manual-controls-container hidden" id="sensor-manual-controls">
                    <input type="text" id="sensor-ip" placeholder="ESP32 Sensor Node IP (e.g. 192.168.137.x)"
                        class="glass-input">
                    <button id="connect-sensor" class="btn-primary">Connect Sensors</button>
                </div>
                <div class="sensor-grid">

                    <!-- Turbidity Card -->
                    <div class="sensor-card glass-panel" id="card-turbidity">
                        <div class="sensor-icon">🌊</div>
                        <div class="sensor-info">
                            <h3>Turbidity</h3>
                            <div class="value-container">
                                <span class="value" id="val-turbidity">--</span>
                                <span class="unit" id="val-turbidity-status">NTU</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="prog-turbidity" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- pH Card -->
                    <div class="sensor-card glass-panel" id="card-ph">
                        <div class="sensor-icon">🧪</div>
                        <div class="sensor-info">
                            <h3>pH Level</h3>
                            <div class="value-container">
                                <span class="value" id="val-ph">--</span>
                                <span class="unit">pH</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="prog-ph" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Temperature Card -->
                    <div class="sensor-card glass-panel" id="card-temp">
                        <div class="sensor-icon">🌡️</div>
                        <div class="sensor-info">
                            <h3>Temperature</h3>
                            <div class="value-container">
                                <span class="value" id="val-temp">--</span>
                                <span class="unit">°C</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" id="prog-temp" style="width: 0%;"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Compact Motor Controls below Sensors -->
                <div class="motor-panel glass-panel">
                    <div class="motor-panel-header">
                        <span class="motor-title">Drive Controls</span>
                        <div class="motor-header-actions">
                            <label for="motor-speed" class="speed-label">Speed:</label>
                            <select id="motor-speed" class="speed-select">
                                <option value="100">100</option>
                                <option value="125">125</option>
                                <option value="150" selected>150</option>
                                <option value="175">175</option>
                                <option value="200">200</option>
                                <option value="225">225</option>
                                <option value="255">255</option>
                            </select>
                            <span class="badge" id="motor-badge">Searching...</span>
                        </div>
                    </div>
                    <div class="node-status-bar" id="motor-status-bar" style="margin-bottom: 0.5rem;">
                        <div class="node-status-info">
                            <span class="status-dot searching" id="motor-dot"></span>
                            <span class="node-label">Motor:</span>
                            <span class="node-detail" id="motor-detail">Scanning...</span>
                        </div>
                        <span class="mac-badge" id="motor-mac-badge">MAC: Auto</span>
                    </div>
                    <button type="button" class="manual-toggle-btn" id="toggle-motor-manual">Manual IP Override ▾</button>
                    <div class="controls manual-controls-container hidden" id="motor-manual-controls" style="margin-bottom: 0.75rem;">
                        <input type="text" id="motor-ip" placeholder="Motor Node IP (e.g. 192.168.137.x)" class="glass-input">
                        <button id="connect-motor" class="btn-primary">Connect</button>
                    </div>
                    <div id="motor-controls" class="motor-btn-row">
                        <button class="btn-primary motor-btn" data-dir="f">▲ Front</button>
                        <button class="btn-primary motor-stop-btn" onclick="sendMotor('s')">■ Stop</button>
                        <button class="btn-primary motor-btn" data-dir="b">▼ Back</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/script.js?v=20261023_5"></script>
</body>

</html>
